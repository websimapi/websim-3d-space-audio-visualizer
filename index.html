<html><head><base href="/">
<title>Enhanced 3D Space Audio Visualizer</title>
<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  
  #visualizer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 20px;
    background: rgba(0,0,0,0.5);
    padding: 15px;
    border-radius: 10px;
  }
  
  button {
    background: #444;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
  }
  
  button:hover {
    background: #666;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="visualizer"></canvas>
<div class="controls">
  <button onclick="togglePlay()">Play/Pause</button>
  <button onclick="resetCamera()">Reset Camera</button>
</div>

<script>
let scene, camera, renderer, particles, audioContext, analyser, source;
let waveformAnalyser;
let playing = false;
const particleCount = 5000; 
const audio = new Audio('Forest Rhythm - Track 1 - Sonauto (2).wav');

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('visualizer'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);
  
  for(let i = 0; i < particleCount * 3; i += 3) {
    const angle = (i / 3) * 0.1;
    const radius = ((i / 3) * 0.02) % 50;
    positions[i] = Math.cos(angle) * radius;
    positions[i + 1] = Math.sin(angle) * radius;
    positions[i + 2] = (Math.random() - 0.5) * 50;
    
    colors[i] = Math.random();
    colors[i + 1] = Math.random();
    colors[i + 2] = Math.random();
    
    sizes[i/3] = Math.random() * 2;
  }
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  
  const material = new THREE.PointsMaterial({
    size: 1,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });
  
  particles = new THREE.Points(geometry, material);
  scene.add(particles);
  
  camera.position.z = 50;
  
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioContext.createAnalyser();
  waveformAnalyser = audioContext.createAnalyser();
  
  analyser.fftSize = 2048; 
  waveformAnalyser.fftSize = 2048;
  
  source = audioContext.createMediaElementSource(audio);
  source.connect(analyser);
  source.connect(waveformAnalyser);
  analyser.connect(audioContext.destination);
  
  audio.loop = true;
  
  animate();
}

let lastBassAvg = 0;
let lastTrebleAvg = 0;
let smoothedVolume = 0;

function animate() {
  requestAnimationFrame(animate);
  
  if (playing) {
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    const waveformData = new Uint8Array(waveformAnalyser.frequencyBinCount);
    analyser.getByteFrequencyData(frequencyData);
    waveformAnalyser.getByteTimeDomainData(waveformData);
    
    const positions = particles.geometry.attributes.position.array;
    const colors = particles.geometry.attributes.color.array;
    const sizes = particles.geometry.attributes.size.array;
    
    let bassSum = 0;
    let trebleSum = 0;
    let totalVolume = 0;
    
    for(let i = 0; i < 10; i++) {
      bassSum += frequencyData[i];
    }
    const bassAvg = bassSum / 10;
    
    for(let i = Math.floor(frequencyData.length * 0.8); i < frequencyData.length; i++) {
      trebleSum += frequencyData[i];
    }
    const trebleAvg = trebleSum / (frequencyData.length * 0.2);
    
    for(let i = 0; i < frequencyData.length; i++) {
      totalVolume += frequencyData[i];
    }
    
    const volume = totalVolume / frequencyData.length;
    smoothedVolume = smoothedVolume * 0.95 + volume * 0.05;
    
    const bassDelta = Math.abs(bassAvg - lastBassAvg);
    const trebleDelta = Math.abs(trebleAvg - lastTrebleAvg);
    
    for(let i = 0; i < positions.length; i += 3) {
      const freqIndex = Math.floor(i / positions.length * frequencyData.length);
      const waveformIndex = Math.floor(i / positions.length * waveformData.length);
      const frequency = frequencyData[freqIndex];
      const waveform = (waveformData[waveformIndex] - 128) / 128;
      
      const angle = (i / 3) * 0.1 + (bassAvg / 255) * 0.2;
      const radius = ((i / 3) * 0.02 + (frequency / 255) * (1 + trebleAvg/255)) % 50;
      
      positions[i] = Math.cos(angle) * radius * (1 + waveform * 0.3);
      positions[i + 1] = Math.sin(angle) * radius * (1 + waveform * 0.3);
      positions[i + 2] *= 0.99 + (frequency / 255) * 0.03;
      
      colors[i] = Math.min(1, frequency / 255 + bassDelta / 255);
      colors[i + 1] = Math.min(1, (waveform + 0.5) + trebleDelta / 255);
      colors[i + 2] = Math.min(1, smoothedVolume / 255);
      
      sizes[i/3] = 1 + (frequency / 255) * 3 + (smoothedVolume / 255) * 2;
    }
    
    particles.geometry.attributes.position.needsUpdate = true;
    particles.geometry.attributes.color.needsUpdate = true;
    particles.geometry.attributes.size.needsUpdate = true;
    
    particles.rotation.x += 0.001 + (bassAvg / 255) * 0.02;
    particles.rotation.y += 0.002 + (trebleAvg / 255) * 0.02;
    particles.rotation.z += 0.001 + (smoothedVolume / 255) * 0.01;
    
    lastBassAvg = bassAvg;
    lastTrebleAvg = trebleAvg;
  } else {
    particles.rotation.x += 0.001;
    particles.rotation.y += 0.002;
  }
  
  renderer.render(scene, camera);
}

function togglePlay() {
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  
  if (playing) {
    audio.pause();
    playing = false;
  } else {
    audio.play();
    playing = true;
  }
}

function resetCamera() {
  camera.position.z = 50;
  camera.position.x = 0;
  camera.position.y = 0;
  camera.rotation.set(0, 0, 0);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let isMouseDown = false;
let previousMousePosition = { x: 0, y: 0 };

document.addEventListener('mousedown', () => isMouseDown = true);
document.addEventListener('mouseup', () => isMouseDown = false);
document.addEventListener('mousemove', (e) => {
  if (isMouseDown) {
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;
    
    camera.position.x += deltaX * 0.05;
    camera.position.y -= deltaY * 0.05;
  }
  
  previousMousePosition = {
    x: e.clientX,
    y: e.clientY
  };
});

document.addEventListener('wheel', (e) => {
  camera.position.z += e.deltaY * 0.1;
  camera.position.z = Math.max(10, Math.min(100, camera.position.z));
});

init();
</script>
