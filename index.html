<html><head><base href="/">
<title>Enhanced Multi-Scene 3D Space Audio Visualizer</title>
<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  
  #visualizer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 20px;
    background: rgba(0,0,0,0.5);
    padding: 15px;
    border-radius: 10px;
  }
  
  button {
    background: #444;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
  }
  
  button:hover {
    background: #666;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="visualizer"></canvas>
<div class="controls">
  <button onclick="togglePlay()">Play/Pause</button>
  <button onclick="resetCamera()">Reset Camera</button>
</div>

<script>
let scene, camera, renderer, analyser, source;
let waveformAnalyser;
let playing = false;
let visualizers = [];
let currentVisualizer = 0;
let transitionProgress = 0;
const particleCount = 3000;
const audio = new Audio('Forest Rhythm - Track 1 - Sonauto (2).wav');

class Visualizer {
  constructor(offset = new THREE.Vector3(0, 0, 0), particleCount = 3000) {
    this.particles = this.createParticles(particleCount);
    this.particles.position.copy(offset);
    this.baseOffset = offset.clone();
    scene.add(this.particles);
  }

  createParticles(count) {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    
    for(let i = 0; i < count * 3; i += 3) {
      positions[i] = this.initialPosition(i, 0);
      positions[i + 1] = this.initialPosition(i, 1);
      positions[i + 2] = this.initialPosition(i, 2);
      
      colors[i] = Math.random();
      colors[i + 1] = Math.random();
      colors[i + 2] = Math.random();
      
      sizes[i/3] = Math.random() * 2;
    }
    
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    
    const material = new THREE.PointsMaterial({
      size: 1,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });
    
    return new THREE.Points(geometry, material);
  }

  initialPosition(i, axis) {
    const patterns = [
      // Spiral
      () => {
        const angle = (i / 3) * 0.1;
        const radius = ((i / 3) * 0.02) % 50;
        return axis === 0 ? Math.cos(angle) * radius :
               axis === 1 ? Math.sin(angle) * radius :
               (Math.random() - 0.5) * 50;
      },
      // Cube
      () => (Math.random() - 0.5) * 50,
      // Sphere
      () => {
        const phi = Math.random() * Math.PI * 2;
        const theta = Math.random() * Math.PI;
        const radius = 25;
        return axis === 0 ? radius * Math.sin(theta) * Math.cos(phi) :
               axis === 1 ? radius * Math.sin(theta) * Math.sin(phi) :
               radius * Math.cos(theta);
      },
      // Double Helix
      () => {
        const t = (i / 3) * 0.1;
        return axis === 0 ? Math.cos(t) * 20 :
               axis === 1 ? Math.sin(t) * 20 :
               t - 25;
      },
      // Wave Field
      () => {
        const x = (i / 3) % 50 - 25;
        const z = Math.floor((i / 3) / 50) - 25;
        return axis === 0 ? x :
               axis === 1 ? Math.sin(Math.sqrt(x*x + z*z) * 0.3) * 10 :
               z;
      }
    ];
    
    return patterns[Math.floor(i/3) % patterns.length]();
  }

  update(frequencyData, waveformData, bassAvg) {
    const positions = this.particles.geometry.attributes.position.array;
    const colors = this.particles.geometry.attributes.color.array;
    const sizes = this.particles.geometry.attributes.size.array;
    
    for(let i = 0; i < positions.length; i += 3) {
      const freqIndex = Math.floor(i / positions.length * frequencyData.length);
      const waveformIndex = Math.floor(i / positions.length * waveformData.length);
      const frequency = frequencyData[freqIndex];
      const waveform = (waveformData[waveformIndex] - 128) / 128;
      
      this.updateParticle(i, positions, colors, sizes, frequency, waveform, bassAvg);
    }
    
    this.particles.geometry.attributes.position.needsUpdate = true;
    this.particles.geometry.attributes.color.needsUpdate = true;
    this.particles.geometry.attributes.size.needsUpdate = true;
    
    this.particles.rotation.x += 0.001 + (bassAvg / 255) * 0.01;
    this.particles.rotation.y += 0.002 + (bassAvg / 255) * 0.01;
  }

  updateParticle(i, positions, colors, sizes, frequency, waveform, bassAvg) {
    const angle = (i / 3) * 0.1 + (bassAvg / 255) * 0.1;
    const radius = ((i / 3) * 0.02 + (frequency / 255) * 0.5) % 50;
    
    positions[i] = Math.cos(angle) * radius * (1 + waveform * 0.2);
    positions[i + 1] = Math.sin(angle) * radius * (1 + waveform * 0.2);
    positions[i + 2] *= 0.99 + (frequency / 255) * 0.02;
    
    colors[i] = frequency / 255;
    colors[i + 1] = waveform + 0.5;
    colors[i + 2] = bassAvg / 255;
    
    sizes[i/3] = 1 + (frequency / 255) * 3;
  }
}

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('visualizer'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  
  // Create 10 visualizers with different offsets
  const positions = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(100, 0, 0),
    new THREE.Vector3(-100, 0, 0),
    new THREE.Vector3(0, 100, 0),
    new THREE.Vector3(0, -100, 0),
    new THREE.Vector3(100, 100, 0),
    new THREE.Vector3(-100, -100, 0),
    new THREE.Vector3(100, -100, 0),
    new THREE.Vector3(-100, 100, 0),
    new THREE.Vector3(0, 0, 100)
  ];
  
  visualizers = positions.map(pos => new Visualizer(pos));
  
  camera.position.z = 50;
  
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioContext.createAnalyser();
  waveformAnalyser = audioContext.createAnalyser();
  
  analyser.fftSize = 1024;
  waveformAnalyser.fftSize = 2048;
  
  source = audioContext.createMediaElementSource(audio);
  source.connect(analyser);
  source.connect(waveformAnalyser);
  analyser.connect(audioContext.destination);
  
  audio.loop = true;
}

function animate() {
  requestAnimationFrame(animate);
  
  if (playing) {
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    const waveformData = new Uint8Array(waveformAnalyser.frequencyBinCount);
    analyser.getByteFrequencyData(frequencyData);
    waveformAnalyser.getByteTimeDomainData(waveformData);
    
    let bassSum = 0;
    for(let i = 0; i < 10; i++) {
      bassSum += frequencyData[i];
    }
    const bassAvg = bassSum / 10;
    
    // Update all visualizers
    visualizers.forEach((visualizer, index) => {
      visualizer.update(frequencyData, waveformData, bassAvg);
      
      // Calculate transition based on sound properties
      const energyLevel = bassAvg / 255;
      if (energyLevel > 0.8) {
        transitionProgress += 0.01;
        if (transitionProgress >= 1) {
          transitionProgress = 0;
          currentVisualizer = (currentVisualizer + 1) % visualizers.length;
        }
      }
      
      // Move non-active visualizers away
      if (index !== currentVisualizer) {
        visualizer.particles.position.lerp(visualizer.baseOffset, 0.05);
      } else {
        visualizer.particles.position.lerp(new THREE.Vector3(0, 0, 0), 0.05);
      }
    });
  }
  
  renderer.render(scene, camera);
}

function togglePlay() {
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  
  if (playing) {
    audio.pause();
    playing = false;
  } else {
    audio.play();
    playing = true;
  }
}

function resetCamera() {
  camera.position.z = 50;
  camera.position.x = 0;
  camera.position.y = 0;
  camera.rotation.set(0, 0, 0);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let isMouseDown = false;
let previousMousePosition = { x: 0, y: 0 };

document.addEventListener('mousedown', () => isMouseDown = true);
document.addEventListener('mouseup', () => isMouseDown = false);
document.addEventListener('mousemove', (e) => {
  if (isMouseDown) {
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;
    
    camera.position.x += deltaX * 0.05;
    camera.position.y -= deltaY * 0.05;
  }
  
  previousMousePosition = {
    x: e.clientX,
    y: e.clientY
  };
});

document.addEventListener('wheel', (e) => {
  camera.position.z += e.deltaY * 0.1;
  camera.position.z = Math.max(10, Math.min(100, camera.position.z));
});

init();
animate();
</script>
